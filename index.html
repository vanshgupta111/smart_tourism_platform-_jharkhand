<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Admin SOS Dashboard - India</title>
    <link href='https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.css' rel='stylesheet' />
    <style>
        body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; display: flex; height: 100vh; }
        
        /* Layout for Sidebar and Map */
        #sidebar { width: 350px; background: #f8f9fa; border-right: 1px solid #ddd; overflow-y: auto; display: flex; flex-direction: column; }
        #map { flex-grow: 1; position: relative; }

        .header { padding: 15px; background: #2c3e50; color: white; text-align: center; }
        .sos-card { 
            padding: 15px; border-bottom: 1px solid #eee; cursor: pointer; transition: background 0.2s; 
        }
        .sos-card:hover { background: #e9ecef; }
        
        /* Status Colors based on your logic */
        .status-pill { padding: 2px 8px; border-radius: 10px; font-size: 12px; font-weight: bold; color: white; }
        .status-cancelled { background-color: grey; }
        .status-resolved { background-color: green; }
        .status-active { background-color: red; }

        .user-name { font-weight: bold; display: block; font-size: 1.1em; }
        .user-info { font-size: 0.9em; color: #555; margin-top: 5px; }

        /* Legend on Map */
        .legend {
            position: absolute; bottom: 20px; right: 20px; background: white;
            padding: 10px; border-radius: 8px; box-shadow: 0 0 10px rgba(0,0,0,0.1);
            z-index: 1; font-size: 12px;
        }
    </style>
</head>
<body>

<div id="sidebar">
    <div class="header">
        <h3>SOS Requests</h3>
    </div>
    <div id="sos-list">
        </div>
</div>

<div id="map">
    <div class="legend">
        <strong>Legend:</strong><br>
        <span style="color:red">●</span> Active/Pending<br>
        <span style="color:green">●</span> Resolved<br>
        <span style="color:grey">●</span> Cancelled
    </div>
</div>

<script src='https://api.mapbox.com/mapbox-gl-js/v2.9.1/mapbox-gl.js'></script>

<script>
    mapboxgl.accessToken = 'pk.eyJ1IjoidmFuc2hndXB0YSIsImEiOiJjbWo4cWRmc3YwM2V4M2ZzZmg2MnI0dWVnIn0.5mccqPSDsnTULMUyjzGE8g';

    // 1. Initialize Map centered on India
    const map = new mapboxgl.Map({
        container: 'map',
        style: 'mapbox://styles/mapbox/streets-v11',
        center: [78.9629, 22.5937],
        zoom: 4.5,
        maxBounds: [[68.1, 6.5], [97.4, 35.5]] // Restricted to India
    });

    map.addControl(new mapboxgl.NavigationControl());

    // 2. Load Data and Join Details
    async function loadSOSData() {
        try {
            const response = await fetch('/api/sos-data');
            const data = await response.json();
            const listContainer = document.getElementById('sos-list');

            data.forEach(sos => {
                // Logic for marker color
                let markerColor = 'red';
                let statusClass = 'status-active';

                if (sos.status === 'Cancelled') {
                    markerColor = 'grey';
                    statusClass = 'status-cancelled';
                } else if (sos.status === 'resolved') {
                    markerColor = 'green';
                    statusClass = 'status-resolved';
                }

                // Get User Details (joined from your users collection via touristId)
                const user = sos.userDetails || {};
                const name = user.name || sos.requesterName || "Unknown Tourist";
                const phone = user.phone || "No Phone Provided";
                const email = user.email || "No Email Provided";

                // Add Marker to Map
                if (sos.location && sos.location.longitude) {
                    const marker = new mapboxgl.Marker({ color: markerColor })
                        .setLngLat([sos.location.longitude, sos.location.latitude])
                        .setPopup(new mapboxgl.Popup().setHTML(`
                            <div style="padding:5px;">
                                <strong>${name}</strong><br>
                                <span>Status: ${sos.status}</span><br>
                                <span>Phone: ${phone}</span>
                            </div>
                        `))
                        .addTo(map);

                    // Add Card to Sidebar
                    const card = document.createElement('div');
                    card.className = 'sos-card';
                    card.innerHTML = `
                        <span class="status-pill ${statusClass}">${sos.status}</span>
                        <span class="user-name">${name}</span>
                        <div class="user-info">
                            📞 ${phone}<br>
                            ✉️ ${email}<br>
                            🕒 ${new Date(sos.timestamp).toLocaleString()}
                        </div>
                    `;
                    
                    // Click card to zoom to location
                    card.onclick = () => {
                        map.flyTo({ center: [sos.location.longitude, sos.location.latitude], zoom: 12 });
                        marker.togglePopup();
                    };

                    listContainer.appendChild(card);
                }
            });
        } catch (err) {
            console.error("Error loading data:", err);
        }
    }

    map.on('load', loadSOSData);
</script>

</body>
</html>

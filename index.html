<!DOCTYPE html>
<html>
<head>
   <title>Jharkhand City Explorer</title>
   <link href="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.css" rel="stylesheet">
   <style>
       body { margin: 0; padding: 0; font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; }
       #map { position: absolute; top: 0; bottom: 0; width: 100%; }
       .popup-content { min-width: 200px; padding: 5px; }
       .popup-content h3 { color: #2c3e50; margin: 0; border-bottom: 2px solid #f39c12; padding-bottom: 4px; }
       .weather-info { font-weight: bold; color: #2980b9; margin-top: 8px; font-size: 14px; }
       .insight-text { font-size: 13px; line-height: 1.6; color: #34495e; margin-top: 10px; border-top: 1px dashed #ccc; padding-top: 8px; }
   </style>
</head>
<body>


<div id="map"></div>


<script src="https://api.mapbox.com/mapbox-gl-js/v2.15.0/mapbox-gl.js"></script>
<script>
   mapboxgl.accessToken = 'pk.eyJ1IjoidmFuc2hndXB0YSIsImEiOiJjbWo4cWRmc3YwM2V4M2ZzZmg2MnI0dWVnIn0.5mccqPSDsnTULMUyjzGE8g';


   const map = new mapboxgl.Map({
       container: 'map',
       style: 'mapbox://styles/mapbox/streets-v12',
       center: [85.3094, 23.3441], // Ranchi
       zoom: 7
   });


   map.on('click', async (e) => {
       const { lng, lat } = e.lngLat;
     
       const popup = new mapboxgl.Popup({ offset: 25 })
           .setLngLat([lng, lat])
           .setHTML('<strong>Loading Local Data...</strong>')
           .addTo(map);


       try {
           // 1. Get the City Name
           const geoUrl = `https://api.mapbox.com/geocoding/v5/mapbox.places/${lng},${lat}.json?types=place&access_token=${mapboxgl.accessToken}`;
           const geoRes = await fetch(geoUrl);
           const geoData = await geoRes.json();


           // Try to get the specific place name first, fallback to the broader district/region
           const cityName = geoData.features.length > 0
               ? geoData.features[0].text  // This will get "Betla" or "Latehar"
               : "Jharkhand";


           // 2. Set Popup Structure
           popup.setHTML(`
               <div class="popup-content">
                   <h3>${cityName}</h3>
                   <div id="weather-display" class="weather-info">Checking weather...</div>
                   <div id="insight-display" class="insight-text">Fetching local records...</div>
               </div>
           `);


           // 3. Fetch Weather
           fetch('/get-weather', {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ cityName })
           })
           .then(res => res.json())
           .then(data => {
               const weatherEl = document.getElementById('weather-display');
               weatherEl.innerText = data.temp ? `${data.temp}°C, ${data.description}` : "Weather unavailable";
           });


           // 4. Fetch Local Insight (Excel Based)
           fetch('/get-ai-insight', {
               method: 'POST',
               headers: { 'Content-Type': 'application/json' },
               body: JSON.stringify({ cityName })
           })
           .then(res => res.json())
           .then(data => {
               // Use innerHTML because our server now sends formatted text
               document.getElementById('insight-display').innerHTML = data.insight;
           })
           .catch(err => {
               document.getElementById('insight-display').innerText = "Details not found in master sheet.";
           });


       } catch (err) {
           console.error(err);
           popup.setHTML('<strong>Error:</strong> Local data unreachable.');
       }
   });
</script>
</body>
</html>
